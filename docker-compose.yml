services:
  postgres:
    image: postgres:16-alpine
    container_name: bhargava-postgres
    environment:
      POSTGRES_DB: bhargava_institute
      POSTGRES_USER: bhargava
      POSTGRES_PASSWORD: bhargava
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhargava -d bhargava_institute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
